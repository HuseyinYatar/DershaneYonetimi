# Local development against local/docker-compose.yml (PostgreSQL, Keycloak, Floci).
spring:
  flyway:
    locations: classpath:db/migration, classpath:db/local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

task:
  aws:
    endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
    static-access-key-id: test
    static-secret-access-key: test
