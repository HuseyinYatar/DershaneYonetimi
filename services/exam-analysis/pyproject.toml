[project]
name = "exam-analysis"
version = "0.1.0"
description = "Mock exam scoring, topic analysis and progress reports for the dershane management system"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "fastapi>=0.115",
    "numpy>=2.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-botocore>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "pandas>=2.2",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.22",
    "moto[s3,sns,sqs]>=5.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N", "C4", "PT", "LOG", "G"]
ignore = [
    "PLR0913",  # FastAPI endpoints and service functions take many injected dependencies
    "PLR0917",
    "PLR2004",
    "S101",
    "RUF001",  # Turkish text (ı, ş, ğ) is not ambiguous here
    "RUF002",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR0915", "PLC0415", "PLR0917"]
"src/app/observability/tracing.py" = ["PLC0415"]  # exporters load only when tracing is enabled
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires PostgreSQL (TEST_DATABASE_URL or Docker for Testcontainers)",
    "floci: requires a running Floci endpoint (FLOCI_ENDPOINT_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
