name: java-service

# Reusable: lint (Spotless, Checkstyle), unit tests, *IT tests (Testcontainers) and JaCoCo.
# All of it is bound to the Maven lifecycle, so `verify` runs the whole stage.
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: services/${{ inputs.service }}/pom.xml
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.service }}-reports
          path: |
            services/${{ inputs.service }}/target/surefire-reports
            services/${{ inputs.service }}/target/failsafe-reports
            services/${{ inputs.service }}/target/site/jacoco*
