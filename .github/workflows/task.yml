name: task

on:
  pull_request:
    paths:
      - services/task/**
      - shared/events/**
      - .github/workflows/task.yml
      - .github/workflows/_java-service.yml
      - .github/workflows/_image.yml
  push:
    branches: [main]
    paths:
      - services/task/**
      - shared/events/**
      - .github/workflows/task.yml
      - .github/workflows/_java-service.yml
      - .github/workflows/_image.yml

  # Manual run on main: builds and delivers this service's current image (first install, re-deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/_java-service.yml
    with:
      service: task
  image:
    needs: test
    # On main: id-token to push to ECR through the AWS role, contents to commit the new tag to k8s/.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_image.yml
    with:
      service: task
