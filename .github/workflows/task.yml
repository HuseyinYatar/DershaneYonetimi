name: task

on:
  pull_request:
    paths:
      - services/task/**
      - shared/events/**
      - .github/workflows/task.yml
      - .github/workflows/_java-service.yml
      - .github/workflows/_image.yml
  push:
    branches: [main]
    paths:
      - services/task/**
      - shared/events/**
      - .github/workflows/task.yml
      - .github/workflows/_java-service.yml
      - .github/workflows/_image.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/_java-service.yml
    with:
      service: task
  image:
    needs: test
    uses: ./.github/workflows/_image.yml
    with:
      service: task
