# Base images in every Dockerfile are pinned as tag@digest, so a build is reproducible.
# Dependabot opens one weekly PR with the new digests/versions; CI builds the images and runs Trivy on it.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /frontend
      - /infra/keycloak
      - /services/api-gateway
      - /services/attendance
      - /services/exam-analysis
      - /services/file
      - /services/messaging
      - /services/notification
      - /services/task
      - /services/user
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    # Major/minor jumps are decided by hand: Java 25, Python 3.14 and Node 24 are fixed in the project
    # (pom.xml, pyproject.toml, .nvmrc), and Keycloak is bumped together with docker-compose.yml and the k8s manifest.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: quay.io/keycloak/keycloak
