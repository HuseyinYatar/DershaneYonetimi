<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dershane</title>
    <!-- Runtime config: the Kubernetes ConfigMap overrides this file, so one image serves every environment. -->
    <script src="/config.js"></script>
    <!-- Painted before any JS arrives, so a slow connection shows the canvas and a spinner instead of white. -->
    <style>
      body {
        margin: 0;
        background: #eef0f3;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .boot::after {
        content: "";
        width: 28px;
        height: 28px;
        border: 3px solid #dcd6ff;
        border-top-color: #6d4aff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Yükleniyor"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
