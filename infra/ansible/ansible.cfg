# Run every command from infra/ansible (paths below are relative to it).
[defaults]
inventory = inventory.ini
remote_user = ubuntu
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
forks = 5

[ssh_connection]
pipelining = True
# Worker public IPs change on every start (infra/scripts/power.sh), so host keys are kept in a project
# file that inventory.sh empties: a key is trusted on first contact and checked for the rest of the
# session (accept-new), instead of turning host key checking off.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o UserKnownHostsFile=.ssh_known_hosts -o StrictHostKeyChecking=accept-new
