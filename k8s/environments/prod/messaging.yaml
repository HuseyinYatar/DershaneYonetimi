# messaging: student-teacher chat (WebSocket through the api-gateway)
# Values for k8s/charts/service. image.tag is written by CI (.github/workflows/_image.yml). Passwords and
# data store addresses come from Secrets Manager (dershane/...); only the AWS account number is written here.
name: messaging
image:
  repository: 423082503744.dkr.ecr.eu-central-1.amazonaws.com/messaging
  tag: bf900069f36e7c31699bc21a720847b606283ee9
aws:
  roleArn: arn:aws:iam::423082503744:role/dershane-prod-messaging

env:
  DB_USERNAME: messaging_service
  DB_POOL_SIZE: "5"             # db.t4g.micro allows ~100 connections in total
  KEYCLOAK_ISSUER_URI: https://auth.onlinecourses.site/realms/dershane
  KEYCLOAK_JWK_SET_URI: http://keycloak.dershane:8080/realms/dershane/protocol/openid-connect/certs
  KEYCLOAK_PUBLIC_URL: https://auth.onlinecourses.site
  AWS_REGION: eu-central-1
  MESSAGING_EVENTS_TOPIC_ARN: arn:aws:sns:eu-central-1:423082503744:messaging-events
  MESSAGING_USER_EVENTS_QUEUE: messaging-user-events
  # ElastiCache speaks TLS and wants the AUTH token; Spring Boot reads both from these variables.
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
secretEnv:
  REDIS_HOST: { key: dershane/endpoints, property: redis_host }
  DB_PASSWORD: { key: dershane/db/messaging_service, property: password }
  SPRING_DATA_REDIS_PASSWORD: { key: dershane/redis, property: password }

secretTemplates:
  # The database address comes from Secrets Manager (dershane/endpoints), not from Git.
  DB_URL:
    template: "jdbc:postgresql://{{ .rdsHost }}:5432/messaging_service?sslmode=require"
    from:
      rdsHost: { key: dershane/endpoints, property: rds_host }
