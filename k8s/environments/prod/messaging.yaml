# messaging: student-teacher chat (WebSocket through the api-gateway)
# Values for k8s/charts/service. <AWS_ACCOUNT_ID>, <RDS_ADDRESS>, <REDIS_ADDRESS> and <IMAGE_TAG> are filled
# by k8s/fill-values.sh from the Terraform outputs (k8s/README.md).
name: messaging
image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.eu-central-1.amazonaws.com/messaging
  tag: <IMAGE_TAG>
aws:
  roleArn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/dershane-prod-messaging

env:
  DB_URL: jdbc:postgresql://<RDS_ADDRESS>:5432/messaging_service?sslmode=require
  DB_USERNAME: messaging_service
  DB_POOL_SIZE: "5"             # db.t4g.micro allows ~100 connections in total
  KEYCLOAK_ISSUER_URI: https://auth.onlinecourses.site/realms/dershane
  KEYCLOAK_JWK_SET_URI: http://keycloak.dershane:8080/realms/dershane/protocol/openid-connect/certs
  KEYCLOAK_PUBLIC_URL: https://auth.onlinecourses.site
  AWS_REGION: eu-central-1
  MESSAGING_EVENTS_TOPIC_ARN: arn:aws:sns:eu-central-1:<AWS_ACCOUNT_ID>:messaging-events
  MESSAGING_USER_EVENTS_QUEUE: messaging-user-events
  # ElastiCache speaks TLS and wants the AUTH token; Spring Boot reads both from these variables.
  REDIS_HOST: <REDIS_ADDRESS>
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
secretEnv:
  DB_PASSWORD: { key: dershane/db/messaging_service, property: password }
  SPRING_DATA_REDIS_PASSWORD: { key: dershane/redis, property: password }
