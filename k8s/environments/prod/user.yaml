# user: users, branches, classrooms; opens the Keycloak accounts
# Values for k8s/charts/service. image.tag is written by CI (.github/workflows/_image.yml). Passwords and
# data store addresses come from Secrets Manager (dershane/...); only the AWS account number is written here.
name: user
image:
  repository: 423082503744.dkr.ecr.eu-central-1.amazonaws.com/user
  tag: 941244c6f77fe247e7efa90ac7a9b763013613c2
aws:
  roleArn: arn:aws:iam::423082503744:role/dershane-prod-user

env:
  DB_USERNAME: user_service
  DB_POOL_SIZE: "5"             # db.t4g.micro allows ~100 connections in total
  KEYCLOAK_ISSUER_URI: https://auth.onlinecourses.site/realms/dershane
  KEYCLOAK_JWK_SET_URI: http://keycloak.dershane:8080/realms/dershane/protocol/openid-connect/certs
  KEYCLOAK_PUBLIC_URL: https://auth.onlinecourses.site
  AWS_REGION: eu-central-1
  USER_EVENTS_TOPIC_ARN: arn:aws:sns:eu-central-1:423082503744:user-events
  KEYCLOAK_SERVER_URL: http://keycloak.dershane:8080
  PASSWORD_SETUP_REDIRECT_URI: https://onlinecourses.site
secretEnv:
  DB_PASSWORD: { key: dershane/db/user_service, property: password }
  KEYCLOAK_ADMIN_CLIENT_SECRET: { key: dershane/keycloak/user-service-client, property: value }

secretTemplates:
  # The database address comes from Secrets Manager (dershane/endpoints), not from Git.
  DB_URL:
    template: "jdbc:postgresql://{{ .rdsHost }}:5432/user_service?sslmode=require"
    from:
      rdsHost: { key: dershane/endpoints, property: rds_host }
