{{- $name := include "service.name" . -}}
{{- $checksum := print (include (print $.Template.BasePath "/configmap.yaml") .) (include (print $.Template.BasePath "/files-configmap.yaml") .) | sha256sum -}}
# The web process: serves HTTP behind the Service. A changed setting restarts the pods (checksum annotation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ $checksum }}
    spec:
      {{- include "service.podCommon" . | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: {{ include "service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.web.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
            {{- if ne (int .Values.web.probes.port) (int .Values.web.port) }}
            - name: management
              containerPort: {{ .Values.web.probes.port }}
            {{- end }}
          envFrom:
            {{- include "service.envFrom" . | nindent 12 }}
          {{- with include "service.awsEnv" . }}
          env:
            {{- . | trim | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.web.probes.liveness }}
              port: {{ .Values.web.probes.port }}
            periodSeconds: 5
            failureThreshold: {{ .Values.web.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probes.liveness }}
              port: {{ .Values.web.probes.port }}
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.readiness }}
              port: {{ .Values.web.probes.port }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "service.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "service.volumes" . | nindent 8 }}
{{- if .Values.worker.enabled }}
---
# The worker process of the same image (Python: events, outbox, background jobs). No Service: nothing calls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "service.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ $checksum }}
    spec:
      {{- include "service.podCommon" . | nindent 6 }}
      containers:
        - name: {{ $name }}-worker
          image: {{ include "service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{- toYaml (required "worker.command is required" .Values.worker.command) | nindent 12 }}
          envFrom:
            {{- include "service.envFrom" . | nindent 12 }}
          env:
            {{- with include "service.awsEnv" . }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- with .Values.worker.livenessCommand }}
          livenessProbe:
            exec:
              command: {{- toYaml . | nindent 16 }}
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "service.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "service.volumes" . | nindent 8 }}
{{- end }}
