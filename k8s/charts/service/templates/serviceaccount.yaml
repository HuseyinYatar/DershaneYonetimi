# The pods' identity. Terraform's IRSA role for this service trusts exactly system:serviceaccount:dershane:<name>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
