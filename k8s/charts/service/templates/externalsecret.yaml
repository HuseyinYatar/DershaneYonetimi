{{- if include "service.hasSecrets" . }}
# Secret settings: External Secrets reads them from AWS Secrets Manager and writes the <name>-secrets
# Secret that the containers load as environment variables. Nothing secret is stored in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "service.name" . }}-secrets
  labels:
    {{- include "service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "service.name" . }}-secrets
    template:
      engineVersion: v2
      data:
        {{- range $env, $_ := .Values.secretEnv }}
        {{ $env }}: {{ printf "{{ .%s }}" $env | quote }}
        {{- end }}
        {{- range $env, $tpl := .Values.secretTemplates }}
        {{ $env }}: {{ $tpl.template | quote }}
        {{- end }}
  data:
    {{- range $env, $ref := .Values.secretEnv }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $ref.key | quote }}
        property: {{ $ref.property | quote }}
    {{- end }}
    {{- range $env, $tpl := .Values.secretTemplates }}
    {{- range $name, $ref := $tpl.from }}
    - secretKey: {{ $name }}
      remoteRef:
        key: {{ $ref.key | quote }}
        property: {{ $ref.property | quote }}
    {{- end }}
    {{- end }}
{{- end }}
