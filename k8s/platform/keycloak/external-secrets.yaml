# Keycloak's own settings from Secrets Manager as environment variables: the database address (it is not in
# Git, Terraform endpoints.tf), the database login and the admin console password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-env
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-env
    template:
      engineVersion: v2
      data:
        KC_DB_URL: "jdbc:postgresql://{{ .rdsHost }}:5432/keycloak?sslmode=require"
        KC_DB_USERNAME: "{{ .KC_DB_USERNAME }}"
        KC_DB_PASSWORD: "{{ .KC_DB_PASSWORD }}"
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ .KC_BOOTSTRAP_ADMIN_PASSWORD }}"
  data:
    - secretKey: rdsHost
      remoteRef: { key: dershane/endpoints, property: rds_host }
    - secretKey: KC_DB_USERNAME
      remoteRef: { key: dershane/db/keycloak, property: username }
    - secretKey: KC_DB_PASSWORD
      remoteRef: { key: dershane/db/keycloak, property: password }
    - secretKey: KC_BOOTSTRAP_ADMIN_PASSWORD
      remoteRef: { key: dershane/keycloak/admin, property: value }
---
# The realm file imported at the first start: realm/dershane-realm.json with the {{ .name }} placeholders
# filled from Secrets Manager (user-service client secret, super-admin's first password, SES login).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-realm
    template:
      engineVersion: v2
      templateFrom:
        - configMap:
            name: keycloak-realm-template
            items:
              - key: dershane-realm.json
                templateAs: Values
  data:
    - secretKey: userServiceClientSecret
      remoteRef: { key: dershane/keycloak/user-service-client, property: value }
    - secretKey: omrServiceClientSecret
      remoteRef: { key: dershane/keycloak/omr-service-client, property: value }
    - secretKey: examAnalysisServiceClientSecret
      remoteRef: { key: dershane/keycloak/exam-analysis-service-client, property: value }
    - secretKey: messagingServiceClientSecret
      remoteRef: { key: dershane/keycloak/messaging-service-client, property: value }
    - secretKey: superadminPassword
      remoteRef: { key: dershane/keycloak/superadmin, property: value }
    - secretKey: smtpHost
      remoteRef: { key: dershane/notification/smtp, property: host }
    - secretKey: smtpPort
      remoteRef: { key: dershane/notification/smtp, property: port }
    - secretKey: smtpUsername
      remoteRef: { key: dershane/notification/smtp, property: username }
    - secretKey: smtpPassword
      remoteRef: { key: dershane/notification/smtp, property: password }
