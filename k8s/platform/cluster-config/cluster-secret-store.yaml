# How External Secrets reaches AWS Secrets Manager. Every ExternalSecret in the cluster names this store.
# It logs in with the token of the external-secrets ServiceAccount (IRSA: STS exchanges it for the
# dershane-prod-external-secrets role, which may read dershane/* only).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
