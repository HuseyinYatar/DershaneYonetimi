# The user service's own database login (Terraform: dershane/db/user_service).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bootstrap-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: bootstrap-db
  data:
    - secretKey: PGUSER
      remoteRef: { key: dershane/db/user_service, property: username }
    - secretKey: PGPASSWORD
      remoteRef: { key: dershane/db/user_service, property: password }
    - secretKey: PGDATABASE
      remoteRef: { key: dershane/db/user_service, property: dbname }
