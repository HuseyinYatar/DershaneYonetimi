# Helm values for jetstack/cert-manager. The Let's Encrypt issuers are in k8s/platform/cluster-config.
crds:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
