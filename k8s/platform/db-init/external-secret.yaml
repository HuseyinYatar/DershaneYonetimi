# The RDS master login and the password of every service database, from Secrets Manager.
# <RDS_MASTER_SECRET_ARN> is the RDS-managed secret (terraform output rds_master_secret_arn), filled by
# k8s/fill-values.sh. The service passwords are Terraform's dershane/db/<database> entries.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-init
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-init
  data:
    - secretKey: PGUSER
      remoteRef: { key: "<RDS_MASTER_SECRET_ARN>", property: username }
    - secretKey: PGPASSWORD
      remoteRef: { key: "<RDS_MASTER_SECRET_ARN>", property: password }
    - secretKey: user_service
      remoteRef: { key: dershane/db/user_service, property: password }
    - secretKey: attendance_service
      remoteRef: { key: dershane/db/attendance_service, property: password }
    - secretKey: task_service
      remoteRef: { key: dershane/db/task_service, property: password }
    - secretKey: messaging_service
      remoteRef: { key: dershane/db/messaging_service, property: password }
    - secretKey: exam_analysis
      remoteRef: { key: dershane/db/exam_analysis, property: password }
    - secretKey: notification
      remoteRef: { key: dershane/db/notification, property: password }
    - secretKey: keycloak
      remoteRef: { key: dershane/db/keycloak, property: password }
