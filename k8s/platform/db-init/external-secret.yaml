# The RDS master login (dershane/db/master, written by Terraform) and the password of every service
# database (dershane/db/<database>), from Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-init
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-init
  data:
    # Data store address from Secrets Manager (Terraform endpoints.tf), so it is not in Git.
    - secretKey: PGHOST
      remoteRef: { key: dershane/endpoints, property: rds_host }
    - secretKey: PGUSER
      remoteRef: { key: dershane/db/master, property: username }
    - secretKey: PGPASSWORD
      remoteRef: { key: dershane/db/master, property: password }
    - secretKey: user_service
      remoteRef: { key: dershane/db/user_service, property: password }
    - secretKey: attendance_service
      remoteRef: { key: dershane/db/attendance_service, property: password }
    - secretKey: task_service
      remoteRef: { key: dershane/db/task_service, property: password }
    - secretKey: messaging_service
      remoteRef: { key: dershane/db/messaging_service, property: password }
    - secretKey: exam_analysis
      remoteRef: { key: dershane/db/exam_analysis, property: password }
    - secretKey: notification
      remoteRef: { key: dershane/db/notification, property: password }
    - secretKey: file_service
      remoteRef: { key: dershane/db/file_service, property: password }
    - secretKey: keycloak
      remoteRef: { key: dershane/db/keycloak, property: password }
