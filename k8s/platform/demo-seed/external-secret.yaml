# Passwords the script needs: the super-admin (to create everyone), Keycloak's admin (to set the demo
# accounts' password) and the shared demo password itself (Terraform: dershane/demo/password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-seed
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: demo-seed
  data:
    - secretKey: SEED_ADMIN_PASSWORD
      remoteRef: { key: dershane/keycloak/superadmin, property: value }
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef: { key: dershane/keycloak/admin, property: value }
    - secretKey: SEED_PASSWORD
      remoteRef: { key: dershane/demo/password, property: value }
