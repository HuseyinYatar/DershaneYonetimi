# Creates the databases and their users inside RDS (the cluster's counterpart of local/postgres/init.sql).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-init
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/HuseyinYatar/DershaneYonetimi.git
    targetRevision: main
    path: k8s/platform/db-init
  destination:
    server: https://kubernetes.default.svc
    namespace: dershane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
