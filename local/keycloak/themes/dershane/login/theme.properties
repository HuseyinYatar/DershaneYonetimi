# Dershane login theme. Parent "base" has no styling of its own; this theme maps the kc* class hooks
# used by the base templates to the classes in css/dershane.css.
parent=base
locales=tr
styles=css/dershane.css

kcFormClass=form
kcFormGroupClass=form-group
kcLabelClass=form-label
kcInputClass=form-input
kcInputGroup=input-group
kcInputErrorMessageClass=field-error
kcFormSettingClass=form-settings
kcFormOptionsWrapperClass=form-link
kcFormButtonsClass=form-actions
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-secondary
kcButtonBlockClass=btn-block
kcFormPasswordVisibilityButtonClass=pw-toggle
kcFormPasswordVisibilityIconShow=icon-eye
kcFormPasswordVisibilityIconHide=icon-eye-off
kcFormSocialAccountListClass=social-list
kcFormSocialAccountListButtonClass=btn btn-secondary btn-block
